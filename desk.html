.메일본문 { background: var(--바탕); border-radius: 12px; padding: 12px 14px; margin: 8px 0 10px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; max-height: 520px; overflow-y: auto; color: var(--글); }

/* 화면 꼬리 — 이 화면에 대한 말은 대화로(사람규칙 「이 화면 어떠세요」 · 대장 6) */

button, [data-가], [data-펼침], [data-정렬], [data-고객], [data-할일], [data-블로그], [data-문자], [data-안내토글], [data-탭가], a { cursor: pointer; }

.원메일 .같은대화 div[data-원메일고름].고름 { background: var(--강조연); color: var(--글); }

}

  .초안틀:not(.읽는중) > .초안읽기, .초안틀:not(.읽는중) > .읽기빈 { display: none; }

}
@media (hover: hover) { .초안행:hover { background: var(--바탕); } .초안행.고름:hover { background: var(--강조연); } .원메일 .같은대화 div[data-원메일고름]:hover { background: var(--바탕); } }
/* /부품:초안틀css */

.입력줄들 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }   /* 1fr 은 minmax(auto,1fr) 라 날짜 칸의 고유 폭(약 200px)이 열을 밀어 폰(390)에서 카드가 오른쪽으로 넘쳤다 (2026-09-19) */
.입력줄들 label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--보조); min-width: 0; }
.입력줄들 select { height: 44px; padding: 0 10px; border: 1px solid var(--선); border-radius: 10px; background: var(--바탕); font-size: 16px; color: var(--글); width: 100%; min-width: 0; }
.입력줄들 input { height: 44px; padding: 0 12px; border: 1px solid var(--선); border-radius: 10px; background: var(--바탕); font-size: 16px; color: var(--글); width: 100%; min-width: 0; }

@keyframes 깜빡 { 0% { background: var(--강조연); box-shadow: 0 0 0 4px var(--강조연); } 100% { background: transparent; box-shadow: none; } }
.강조 { animation: 깜빡 2.2s ease-out; border-radius: 12px; }
.줄 .때 .며칠.오래 { color: var(--막힘); }
.글씨체표 { font-size: 13px; color: var(--흐림); text-align: right; margin: -8px 0 8px; }

.막대그래프 div.플러스 { background: var(--강조); }

/* 달마다 손익 — 0 기준선 위아래로 (2026-09-22 유니스 「좀 더 상세하면 좋겠고 더 이전의 데이터도」)
   ⛔ 종전 막대그래프는 +438만원과 −558만원이 같은 바닥에서 똑같이 위로 자라고 색만 달랐다.
      손해가 큰 달이 제일 높아 보였다. 부호는 자리(위·아래)가 말하고 색은 거들기만 한다 — 색만으로 가르지 않는다(사람규칙 1장). */
.손익그림 { position: relative; margin-top: 12px; }

.손익막대 { display: flex; gap: 3px; align-items: stretch; padding-right: 16px; }   /* 오른쪽 16px 은 「0」 글자 자리 — 안 비우면 마지막 막대에 겹친다 */
.손익막대 .달칸 { flex: 1; min-width: 0; }
.손익막대 .윗칸 { height: 54px; display: flex; align-items: flex-end; }

.손익막대 i { display: block; width: 100%; background: var(--좋음); border-radius: 4px 4px 0 0; }
.손익막대 .아랫칸 i { background: var(--막힘); border-radius: 0 0 4px 4px; }
.손익막대 .달이름 { font-size: 11px; color: var(--흐림); text-align: center; margin-top: 6px; white-space: nowrap; }
.손익막대 .달칸.짚음 i { outline: 2px solid var(--글); outline-offset: 1px; }
.손익막대 .달칸.짚음 .달이름 { color: var(--글); font-weight: 600; }
.줄 .때 { font-size: 14px; color: var(--흐림); margin-top: 4px; }
.빈 { color: var(--흐림); font-size: 16px; padding: 8px 0; }
/* 늘 쓰는 것(고정) — 2026-09-19 유니스 「원장님이 보고 '이렇게 하면 맨 위에 고정되는구나'를 직관적으로 알게」. 글자 단추(아이콘만 X) · 누르면 그 자리에서 위로 올라간다 */
.줄 { position: relative; }
.고정단추 { position: absolute; right: 0; top: 10px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--강조); background: #fff; color: var(--강조); font-size: 13px; font-weight: 600; line-height: 30px; }

.줄.고정있음 { padding-right: 86px; }
.늘쓰는것 { border: 2px solid var(--강조); }
.늘쓰는것 h2 { color: var(--강조); }
/* 일정(2026-09-20) — 예약은 진하게 · 기한은 보통 · 참고는 접어서 */
.일정줄 { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--선); align-items: flex-start; }
.일정줄 .때칸 { flex: 0 0 64px; font-size: 15px; font-weight: 600; color: var(--글); line-height: 1.3; }
.일정줄 .때칸 small { display: block; font-weight: normal; color: var(--흐림); font-size: 12px; }
.일정줄 .몸 { flex: 1; min-width: 0; }
.일정줄.예약 .제목 { color: var(--강조); }
.일정줄.취소 .제목 { text-decoration: line-through; color: var(--흐림); }

.날머리 { font-size: 15px; font-weight: 600; color: var(--보조); margin: 14px 0 2px; }

.보기줄 { display: flex; gap: 6px; margin: 4px 0 10px }
.보기줄 button { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--선); background: var(--카드); color: var(--보조); font-size: 15px }
.보기줄 button.켬 { background: var(--강조연); border-color: var(--강조연); color: var(--강조); font-weight: 600 }

.달표 .칸 .날 { font-size: 13px; font-weight: 600; color: var(--글) }

.달표 .칸.골 { outline: 2px solid var(--강조) }
.달표 .칸 .점줄 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; color: var(--보조) }
.달표 .칸 .점줄.예약 { color: var(--강조); font-weight: 600 }
.달표 .칸 .더수 { color: var(--흐림) }
.주표 .날머리 { margin-top: 10px }
.시간줄 { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--선); min-height: 34px }
.시간줄 .시 { flex: 0 0 48px; font-size: 13px; color: var(--흐림) }
.날머리.오늘 { color: var(--강조); }
/* 차례 바꾸기(2026-09-21 유니스 「항목 순서는 원장님이 직접 판단하고 바꿀 수 있게」 → 같은 날 「버튼이 아니라 그냥 끌고 가기」)
   — 손잡이(⋮⋮)는 바로 끌리고, 카드 제목·할 일 줄은 길게 눌러(0.4초) 들어 올린다. iOS 미리 알림·구글 킵·토스 홈 편집과 같은 손놀림(M3 「long press and drag」) */
.손잡이 { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--흐림); touch-action: none; cursor: grab; flex: 0 0 auto; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
.손잡이 svg { width: 20px; height: 20px; fill: currentColor }
.손잡이:active { cursor: grabbing }
.카드 h2 .손잡이 { margin-left: auto }
.줄.끌수있음 { position: relative; padding-right: 44px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
.줄 .손잡이 { position: absolute; right: -4px; top: 8px }
.줄:first-of-type .손잡이 { top: -4px }
[data-차례키] > h2 { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
.끌림 { position: relative; z-index: 30; box-shadow: 0 10px 28px rgba(0,0,0,.18); background: var(--카드); border-radius: 16px; transform-origin: center; opacity: .96 }
.끌림.줄 { padding-left: 10px; padding-right: 54px; margin: 0 -10px }
body.끌기중 { -webkit-user-select: none; user-select: none; cursor: grabbing }
body.끌기중 * { cursor: grabbing !important }
.차례옮김 { transition: transform .18s ease }
/* 왼쪽 메뉴·탭 차례(2026-09-24 유니스 「왼쪽 트리 순서도, 폰 아래 순서도」)
   — PC 메뉴는 1단을 감싼 .메뉴항 을 길게 눌러 끈다(2단 구역이 함께 따라간다).
     폰 아래 탭은 60px 칸이라 그 자리에서 못 끄니, 길게 누르면 「탭 차례」 시트가 열리고 거기서 세로로 끈다 */

.메일위 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }

.메일행 .행1 { display: flex; gap: 8px; align-items: baseline; }

.메일행 .행3 { font-size: 13px; color: var(--흐림); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.메일행 .클립 { flex: 0 0 auto; width: 14px; height: 14px; stroke: var(--흐림); fill: none; stroke-width: 2; }
.메일행.안읽음 .누구, .메일행.안읽음 .행2 .글 { font-weight: 700; }
.메일행 .점 { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--강조); align-self: center; }
.메일행 .깃발, .메일행 .클립 { flex: 0 0 auto; }

.읽기창 .메일도구 .단추.켬 { background: #FDECEC; border-color: #F4C7C7; color: #B03A3A; }

.읽기창 .알림줄 { color: var(--보조); font-size: 13px; margin-top: 10px; padding: 8px 10px; border: 0; background: var(--바탕); border-radius: 8px; }
.메일행.봐야 { border-left-color: var(--강조); }
.메일행.고름 { background: var(--강조연); border-left-color: var(--강조); }
.메일행.흐림 .누구, .메일행.흐림 .행2 { color: var(--보조); }
.읽기창 { padding: 18px 22px 24px; }
.읽기창 .뒤로 { background: none; border: 0; color: var(--강조); font-size: 15px; padding: 0 0 10px; }

.읽기창 .머리 { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--선); }
.읽기창 .동그라미 { flex: 0 0 40px; height: 40px; border-radius: 50%; background: var(--강조연); color: var(--강조); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.읽기창 .머리글 { flex: 1; min-width: 0; font-size: 14px; color: var(--보조); line-height: 1.55; overflow-wrap: anywhere; }

.읽기창 .메일도구 { margin: 12px 0 0; }
.비서묻기 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 0; }
.비서묻기 .제 { font-size: 13px; color: var(--흐림); margin-right: 2px; }
.비서묻기 button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--강조연); background: var(--카드); color: var(--강조); font-size: 14px; cursor: pointer; }
.메일함묻기단추 { height: 40px; flex: 0 0 auto; }
.메일함물음 { margin: 0 0 10px; }
.메일열기링크 { color: var(--강조); cursor: pointer; white-space: nowrap; font-size: 14px; }
@media (hover: hover) { .비서묻기 button:hover { background: var(--강조연); } }
.읽기창 .첨부들 { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.읽기창 .첨부칩 { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--선); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--글); background: var(--바탕); max-width: 100%; overflow-wrap: anywhere; }
.읽기창 .첨부칩 svg { width: 14px; height: 14px; stroke: var(--흐림); fill: none; stroke-width: 2; flex: 0 0 auto; }
.읽기창 .메일본문 { max-height: none; background: transparent; padding: 14px 0 6px; margin: 0; }
.읽기창 .같은대화 { margin-top: 14px; border-top: 1px solid var(--선); padding-top: 10px; }
.읽기창 .같은대화 .제 { font-size: 13px; color: var(--흐림); margin-bottom: 4px; }
.읽기창 .같은대화 div[data-메일고름] { font-size: 14px; padding: 6px 0; cursor: pointer; color: var(--보조); }
.읽기창 .같은대화 div[data-메일고름] b { color: var(--글); font-weight: 600; }
.읽기빈 { padding: 60px 20px; text-align: center; color: var(--흐림); }
@media (min-width: 900px) {
  .메일틀 { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; height: calc(100vh - 170px); min-height: 480px; }
  .메일목록 { overflow-y: auto; border-right: 1px solid var(--선); }
  .읽기창, .읽기빈 { overflow-y: auto; }
  .읽기창 .뒤로 { display: none; }
}
@media (max-width: 899px) {
  .메일틀.읽는중 .메일목록 { display: none; }

  .읽기창 { padding: 14px 16px 20px; }
}
@media (hover: hover) { .메일행:hover { background: var(--바탕); } .메일행.고름:hover { background: var(--강조연); } }
.메일줄 .보낸이 { font-weight: 600; color: var(--글); }
.메일줄 .제목 { font-weight: 400; margin-top: 2px; }
.메일줄.접힘 { opacity: .62; }
.메일줄 .단추줄 { margin: 10px 0 0; }
.메일줄 .단추줄 .단추 { height: 40px; font-size: 15px; }
a.단추 { display: inline-flex; align-items: center; text-decoration: none; color: #fff; }
/* 소식 다섯 꼴(2026-09-21) — 한 글을 곳마다 꼴로 · 칩으로 고르고 「본문 복사」 */
.꼴줄 { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
.꼴줄 button { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--선); background: var(--카드); color: var(--보조); font-size: 14px; }
.꼴줄 button.켬 { background: var(--강조연); border-color: var(--강조연); color: var(--강조); }
.꼴안내 { font-size: 14px; color: var(--보조); margin: -4px 0 10px; }
/* 고객(2026-09-21 유니스 「앱 하나로 · 고객 명단 통째 · 주민번호는 앞자리+뒷자리 첫 번호」) — 검색 · 전화 걸기 · 이번 주 연락 · 결과 단추 */
.검색줄 { display: flex; gap: 8px; margin-bottom: 10px; }

.고객줄 .이유 { font-size: 15px; color: var(--강조); margin-top: 2px; }
.전화단추 { height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--강조); background: var(--카드); color: var(--강조); font-size: 15px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; white-space: nowrap; }

.고객표 td { padding: 7px 4px; border-bottom: 1px solid var(--선); word-break: break-all; }

.결과줄 button { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--강조); background: var(--카드); color: var(--강조); font-size: 15px; }

/* 남이 하신 것(2026-09-22 유니스 「원장님이 무슨 피드백 주셨는지 바로 화면에서」) — 대표 홈 카드 · 뒷단 한일 표를 사람 말로 */
.한일줄 { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--선); font-size: 15px; }
.한일줄:first-of-type { border-top: 0; }
.한일줄 .때칸 { flex: 0 0 74px; color: var(--흐림); font-size: 14px; padding-top: 1px; }

.한일줄 .몸 b { font-weight: 600; }

.상대칩 { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--강조연); color: var(--강조); font-size: 12px; margin-right: 4px; vertical-align: middle; }
.상대줄 .단추.테 { height: 36px; font-size: 14px; }
/* 다른 사람 화면으로 보기(2026-09-21 유니스 「내 화면에서 원장님 화면으로 바로 넘어갈 수 있는 옵션」) — 머리의 눈 단추로 들어가고, 보는 동안 띠가 늘 떠 있고, 쓰기는 막힌다 */
.눈 { position: relative; height: 40px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid var(--선); background: var(--카드); color: var(--보조); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; margin-right: 4px }

body.보기중 .위 { border-bottom-color: #F1D9A6 }
body.보기중 .입력줄 { display: none !important }
.고정힌트 { font-size: 15px; color: var(--보조); background: var(--강조연); border-radius: 10px; padding: 10px 12px; margin-top: 6px; line-height: 1.5; }

.단추.테 { background: var(--카드); color: var(--강조); }

/* 화면정리(2026-10-12 GN) — 홈·할 일·받은 것을 같은 기준으로. 설정 「화면정리」가 있는 조직만 이 칸들이 그려진다 */
.차례기준 { font-size: 15px; color: var(--보조); background: var(--바탕); border-radius: 10px; padding: 8px 12px; margin: 0 0 10px; line-height: 1.5; }

.주제칩 { display: inline-block; font-size: 14px; font-weight: 600; color: var(--보조); border: 1px solid var(--선); border-radius: 6px; padding: 0 7px; margin-right: 6px; vertical-align: 1px; }
.이유줄 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
