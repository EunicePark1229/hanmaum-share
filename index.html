<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>한마음보청기 — 보내 드린 것</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root { --bg:#F1F6FB; --surface:#FFFFFF; --ink:#1B2432; --muted:#59657A;
        --line:#D9E3EF; --pink:#FD5C77; --blue:#2D6DA2; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111823; --surface:#1B2434; --ink:#E9EEF6; --muted:#9DA9BC;
          --line:#2C3648; --pink:#FF8098; --blue:#8FBBE2; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:17px; line-height:1.65; }
.wrap { max-width:520px; margin:0 auto; padding:44px 18px 60px; }
h1 { font-family:'Jua','Noto Sans KR',sans-serif; font-size:30px; color:var(--pink);
     margin:0 0 8px; line-height:1.25; }
p.lede { margin:0 0 28px; color:var(--muted); font-size:16px; }
a.item { display:block; background:var(--surface); border:2px solid var(--line);
         border-radius:14px; padding:18px 20px; text-decoration:none; color:inherit;
         margin-bottom:14px; }
a.item:hover { border-color:var(--blue); }
a.item:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
a.item b { display:block; font-size:20px; font-weight:900; margin-bottom:3px; color:var(--blue); }
a.item span { color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>한마음보청기</h1>
  <p class="lede">원장님께 보내 드린 것입니다. 눌러서 열어 보세요.</p>
  <a class="item" href="card.html">
    <b>명함 시안 고르기</b>
    <span>일곱 가지 중에 하나를 고르고 하고 싶은 말씀을 적는 자리입니다</span>
  </a>
  <a class="item" href="chuseok.html">
    <b>추석 이벤트 포스터 고르기</b>
    <span>지금 포스터의 행사 세 가지를 살려 셋으로 만들었습니다</span>
  </a>
</div>
</body>
</html>
