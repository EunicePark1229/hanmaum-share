<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보장구 급여 재지원 — 한마음보청기</title>
<!--
  보장구 급여 재지원 — 원장님이 폰으로 보시는 화면
  · 5년 내구연한이 지나면 급여로 다시 지원받으실 수 있다. 먼저 연락드린 곳으로 오신다.
  · 문자로 보내지 않는다 — 서류가 붙고, 재구매 권유는 광고성 정보가 된다. 전화하시는 화면이다.
  · 굵기로 위계를 안 만든다 — 크기·색·자리·여백만 쓴다. 굵기는 처음부터 끝까지 500 하나.
  · 본문 18px 이상 · 누르는 것 56px 이상 · 폭 390px 에서 가로 스크롤 0.
  · 손님 앞에서 열려도 되는 화면이라 금액·매출·요금이 한 글자도 없다.
  · 날짜는 전부 사람 말로 적는다 — 「-1004일」이 아니라 「2년 8개월 지났어요」.
  · 자료는 화면 안에 박혀 있고, 남기신 것은 이 폰 안에만 저장된다(밖으로 안 나간다).

  이걸 만들면서 그만둔 것 — 만료일 목록을 엑셀로 훑어 보시던 것.
-->
<style>
:root{
  --bg:#FDF6EE;      /* 바탕 */
  --card:#FFFFFF;
  --ink:#2A2118;     /* 본문 */
  --ink2:#5A4A3C;    /* 곁말 */
  --main:#8B5E3C;    /* 주 */
  --line:#EBDFD2;    /* 선 */
  --past:#9C3A2E;    /* 지난 것 */
  --other:#2D4A6B;   /* 다른 곳에서 사신 분 */
  --soft:#F6EADD;
  --softblue:#EDF1F6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-weight:500;
  font-size:18px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,b,strong{font-weight:inherit;margin:0;font-size:inherit}
button,textarea{font-family:inherit;font-weight:inherit;color:inherit}
a{color:inherit}

.wrap{max-width:430px;margin:0 auto;padding:16px 14px 56px}

/* ── 머리 ───────────────────────────── */
.top{padding:6px 2px 18px}
.top .name{font-size:17px;color:var(--ink2)}
.top .title{font-size:26px;margin-top:2px}
.top .why{font-size:17px;color:var(--ink2);margin-top:10px;line-height:1.65}
.top .day{font-size:16px;color:var(--ink2);margin-top:8px}

/* ── ① 지금 몇 분인가 ───────────────── */
.sum{background:var(--card);border:2px solid var(--line);border-radius:16px;
     padding:20px 18px;margin-bottom:12px}
.sum.now{border-color:var(--past);background:#FFF8F6}
.sum .lab{font-size:19px;color:var(--ink2)}
.sum.now .lab{color:var(--past)}
.sum .cnt{font-size:52px;line-height:1.15;margin-top:2px;color:var(--past)}
.sum .cnt small{font-size:24px}
.sum .sub{font-size:17px;color:var(--ink2);margin-top:4px}

.sum.soon{padding:16px 18px}
.sum.soon .line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sum.soon .lab{font-size:18px;color:var(--ink2)}
.sum.soon .n{font-size:28px;color:var(--main)}
.sum.soon .sub{margin-top:2px}

/* ── 섹션 제목 ──────────────────────── */
.sec{margin:30px 0 12px;padding:0 2px}
.sec .t{font-size:21px}
.sec .d{font-size:16px;color:var(--ink2);margin-top:2px}

/* ── ② 카드 ────────────────────────── */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;
      padding:18px 16px;margin-bottom:14px;overflow:hidden}
.card.other{border-left:9px solid var(--other)}
.card.ours{border-left:9px solid var(--main)}

.pin{display:inline-block;font-size:16px;line-height:1.45;padding:5px 12px;border-radius:9px;
     max-width:100%}
.pin.other{background:var(--softblue);color:var(--other)}
.pin.ours{background:var(--soft);color:var(--main)}

.who{font-size:29px;margin:10px 0 2px}
.gap{font-size:21px;color:var(--past);margin-bottom:2px}
.exp{font-size:16px;color:var(--ink2)}
.pull{font-size:17px;color:var(--other);margin-top:10px;line-height:1.6}

.tel{display:flex;align-items:center;justify-content:center;gap:10px;
     min-height:62px;margin-top:16px;border-radius:14px;
     background:var(--main);color:#fff;text-decoration:none;font-size:24px;letter-spacing:.4px}
.tel .ic{font-size:20px}

.more{width:100%;min-height:56px;margin-top:10px;border-radius:14px;
      background:#fff;border:2px solid var(--main);color:var(--main);
      font-size:18px;cursor:pointer;padding:0 12px}
.talk{margin-top:10px;background:var(--soft);border-radius:14px;padding:16px 16px 14px}
.talk .h{font-size:16px;color:var(--main);margin-bottom:8px}
.talk ul{margin:0;padding-left:0;list-style:none}
.talk li{font-size:18px;line-height:1.65;color:var(--ink);padding-left:16px;
         position:relative;margin-bottom:10px}
.talk li:last-child{margin-bottom:0}
.talk li::before{content:'·';position:absolute;left:2px;color:var(--main)}
.talk .no{margin-top:12px;padding-top:12px;border-top:2px solid #E8D8C6;
          font-size:16px;color:var(--ink2);line-height:1.6}
.talk .memo{margin-top:12px;padding-top:12px;border-top:2px solid #E8D8C6;
            font-size:16px;color:var(--ink2);line-height:1.6;word-break:break-all}
.talk .memo em{font-style:normal;color:var(--main);display:block;margin-bottom:2px;font-size:15px}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.chip{min-height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;
      color:var(--ink);font-size:17px;cursor:pointer;padding:0 6px;line-height:1.35}
.chip.wide{grid-column:1 / -1}
.chip[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}

.note{margin-top:12px}
.note label{display:block;font-size:16px;color:var(--ink2);margin-bottom:6px}
.note textarea{width:100%;min-height:78px;border:2px solid var(--line);border-radius:14px;
               padding:12px;font-size:17px;line-height:1.6;background:#fff;resize:vertical}
.note textarea:focus{outline:none;border-color:var(--main)}
.saved{font-size:16px;color:var(--main);margin-top:10px;min-height:26px}

/* ── ③ 앞으로 오실 분 ──────────────── */
.slim{background:var(--card);border:2px solid var(--line);border-radius:16px;
      padding:16px;margin-bottom:12px;border-left:9px solid var(--main)}
.slim .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.slim .n{font-size:23px}
.slim .when{font-size:17px;color:var(--main);white-space:nowrap}
.slim .r2{font-size:16px;color:var(--ink2);margin-top:2px}
.slim a.telmini{display:flex;align-items:center;justify-content:center;min-height:56px;
                margin-top:12px;border-radius:13px;border:2px solid var(--main);
                color:var(--main);text-decoration:none;font-size:20px;background:#fff}

.fold{width:100%;min-height:60px;border-radius:16px;border:2px solid var(--line);
      background:#fff;color:var(--ink);font-size:18px;cursor:pointer;padding:0 14px;
      display:flex;align-items:center;justify-content:space-between;gap:10px}
.fold .arw{color:var(--main);font-size:16px}
.later{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
     background:#fff;border:2px solid var(--line);border-radius:14px;
     padding:14px 14px;margin-bottom:8px;min-height:60px}
.row .l{min-width:0}
.row .nm{font-size:19px}
.row .tag{font-size:15px;color:var(--ink2);margin-top:1px}
.row .tag.other{color:var(--other)}
.row .yr{font-size:17px;color:var(--main);white-space:nowrap}

.foot{margin-top:32px;padding:0 4px;font-size:15px;color:var(--ink2);line-height:1.7}
  .memo.warn{border-left:3px solid #8B5E3C;background:#F6ECE2}
  .memo.warn em{color:#7A4A2B}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="name">한마음보청기</div>
    <h1 class="title">보장구 급여 재지원</h1>
    <div class="why">보청기 사신 지 5년이 지나면 급여로 다시 지원받으실 수 있습니다.<br>먼저 연락드린 곳으로 오십니다.</div>

  </div>

  <!-- ① 지금 몇 분인가 -->
  <div class="sum now">

  <!-- ② 지금 연락드릴 분 -->
  <div class="sec">

  </div>
  <div id="지난목록"></div>

  <!-- ③ 앞으로 오실 분 -->
  <div class="sec">
    <h2 class="t">앞으로 오실 분</h2>

    <span class="arw" id="펴기표">펴 보기 ▾</span>
  </button>
  <div class="later" id="나중목록" hidden></div>

  <div class="foot">
    남기신 것은 이 폰 안에만 저장됩니다.<br>
    문자로는 보내지 않습니다 — 서류가 붙는 일이고, 다시 사시라는 안내는 광고성 정보가 됩니다.
  </div>

</div>

/* ── 날짜를 사람 말로 ──────────────────────────────────── */
function 날(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function 오늘(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function 차이(앞, 뒤){                    /* 앞 → 뒤 로 흐른 년·개월·일 */
  var y=뒤.getFullYear()-앞.getFullYear();
  var m=뒤.getMonth()-앞.getMonth();
  var d=뒤.getDate()-앞.getDate();
  if(d<0){ m--; d += new Date(뒤.getFullYear(), 뒤.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  return {y:y, m:m, d:d};
}
function 일수(앞, 뒤){ return Math.round((뒤-앞)/86400000); }

function 지난말(만료){                     /* 「2년 8개월 지났어요」 */
  var c=차이(만료, 오늘());
  if(c.y>0 && c.m>0) return c.y+'년 '+c.m+'개월 지났어요';
  if(c.y>0)          return c.y+'년 지났어요';
  if(c.m>0)          return c.m+'개월 지났어요';
  if(c.d>0)          return c.d+'일 지났어요';
  return '오늘 지났어요';
}
function 남은말(만료){                     /* 「58일 남았어요」 · 「2년 4개월 뒤」 */
  var n=일수(오늘(), 만료);
  if(n<=0)  return '오늘이에요';
  if(n<100) return n+'일 남았어요';
  var c=차이(오늘(), 만료);
  if(c.y>0 && c.m>0) return c.y+'년 '+c.m+'개월 뒤예요';
  if(c.y>0)          return c.y+'년 뒤예요';
  return c.m+'개월 뒤예요';
}
function 날말(만료){                       /* 「2026년 11월 6일」 */
  return 만료.getFullYear()+'년 '+(만료.getMonth()+1)+'월 '+만료.getDate()+'일';
}
function 달말(만료){                       /* 「2029년 1월」 */
  return 만료.getFullYear()+'년 '+(만료.getMonth()+1)+'월';
}

/* 한 분이 어떤 분인지 한 줄로. 「다른 곳」과 「저희와 하신 적」은 서로 다른 말이다 —
   이 기기를 어디서 사셨나(어디) 와, 저희와 하신 귀 수(자사) 가 따로 있다. */
function 곁말(p){
  var 밖 = (p.어디 === '다른 곳');
  if(밖 && p.자사 > 0) return '이 기기는 다른 곳에서 사셨어요. 저희와도 하신 적 있는 분이에요';
  if(밖)               return '저희와는 아직 처음이세요. 이번에 오실 수 있는 분이에요';
  if(p.자사 > 0)       return '저희와 '+p.자사+'귀 하신 분이에요';
  return '이 보청기를 저희에게서 사신 분이에요';
}

function 안전(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── 자료를 셋으로 가른다 ──────────────────────────────── */
var 오 = 오늘();
손님.forEach(function(p){ p.날짜=날(p.만료); p.남=일수(오, p.날짜); });
손님.sort(function(a,b){ return a.남-b.남; });

var 지난  = 손님.filter(function(p){ return p.남 < 0; });
var 올해  = 손님.filter(function(p){ return p.남 >= 0 && p.날짜.getFullYear() === 오.getFullYear(); });
var 나중  = 손님.filter(function(p){ return p.남 >= 0 && p.날짜.getFullYear() >  오.getFullYear(); });

/* ── 머리 ──────────────────────────────────────────── */
document.getElementById('오늘').textContent =
  '오늘 ' + (오.getMonth()+1) + '월 ' + 오.getDate() + '일 기준';
document.getElementById('지난수').textContent = 지난.length;

var 지난밖 = 지난.filter(function(p){ return p.어디 === '다른 곳'; }).length;
document.getElementById('지난밖').textContent =
  지난밖 === 0 ? '' :
  (지난밖 === 지난.length ? '모두 다른 곳에서 사신 분이에요'
                          : '그중 ' + 지난밖 + '분은 다른 곳에서 사신 분이에요');
document.getElementById('올해수').textContent = 올해.length;
document.getElementById('올해줄').textContent = 올해.length
  ? 올해.map(function(p){ return p.이름+' 님 · '+날말(p.날짜)+' · '+남은말(p.날짜); }).join(' / ')
  : '올해 안에는 없습니다';

/* ── ② 지금 연락드릴 분 — 카드 ──────────────────────── */
var 지난상자 = document.getElementById('지난목록');

지난.forEach(function(p, i){
  var 밖 = (p.어디 === '다른 곳');

  var el = document.createElement('div');

  var h =
    '<div class="pin '+(밖?'other':'ours')+'">'+(밖?'이 보청기는 다른 곳에서':'이 보청기는 저희에게서')+'</div>'+

    '<a class="tel" href="tel:'+안전(p.폰)+'"><span class="ic">전화</span>'+안전(p.폰)+'</a>'+
    '<button class="more" type="button" aria-expanded="false">무슨 말씀 드릴까요 ▾</button>'+
    '<div class="talk" hidden>'+
      '<div class="h">보시면서 말씀하세요</div>'+
      '<ul>'+
        '<li>보청기 사신 지 5년이 지나서 다시 지원받으실 수 있습니다</li>'+
        '<li>서류는 저희가 도와드립니다</li>'+
        '<li>지금 쓰시는 것 점검부터 한번 받으러 오세요</li>'+
      '</ul>'+
      '<div class="no">「사세요」라고는 하지 않습니다.</div>'+
      (p.사정 ? '<div class="memo warn"><em>원장님이 알려 주신 것</em>'
                +안전(p.사정)+'</div>' : '')+
      (p.메모 ? '<div class="memo"><em>지난 기록</em>'+안전(p.메모)+'</div>' : '')+
    '</div>'+
    '<div class="chips">'+
      '<button class="chip" type="button" aria-pressed="false">통화했어요</button>'+
      '<button class="chip" type="button" aria-pressed="false">안 받으셨어요</button>'+
      '<button class="chip" type="button" aria-pressed="false">방문 약속</button>'+
      '<button class="chip" type="button" aria-pressed="false">다음에 다시</button>'+

    '</div>'+

      '<label for="메모'+i+'">남기실 말씀</label>'+

    '</div>'+
    '<div class="saved"></div>';

  el.innerHTML = h;
  지난상자.appendChild(el);

  var 펴는단추 = el.querySelector('.more');
  var 말할거리 = el.querySelector('.talk');
  펴는단추.addEventListener('click', function(){
    var 열림 = !말할거리.hidden;
    말할거리.hidden = 열림;

  var 칩들 = el.querySelectorAll('.chip');

  function 그리기(){
    for(var k=0; k<칩들.length; k++){
      칩들[k].setAttribute('aria-pressed', String(낸.상태 === 단추말[k]));
    }
    표시.textContent = 낸.상태 ? (낸.날 + ' · ' + 낸.상태 + ' 라고 적어 두었어요') : '';
  }

  for(var k=0; k<칩들.length; k++){
    (function(말, 단추){
      단추.addEventListener('click', function(){
        낸.상태 = (낸.상태 === 말) ? '' : 말;
        낸.날 = (new Date().getMonth()+1) + '월 ' + new Date().getDate() + '일';
        if(!낸.상태){ 낸.날 = ''; }
        기록[키] = 낸; 적기(); 그리기();
      });
    })(단추말[k], 칩들[k]);
  }

  칸.value = 낸.글 || '';
  칸.addEventListener('input', function(){
    낸.글 = 칸.value; 기록[키] = 낸; 적기();
  });

  그리기();
});

/* ── ③ 앞으로 오실 분 ──────────────────────────────── */
document.getElementById('앞으로설명').textContent =
  '올해 ' + 올해.length + '분, 그 뒤로 ' + 나중.length + '분입니다';

var 올해상자 = document.getElementById('올해목록');
올해.forEach(function(p){
  var 밖 = (p.어디 === '다른 곳');
  var el = document.createElement('div');
  el.className = 'slim';
  if(밖){ el.style.borderLeftColor = '#2D4A6B'; }
  el.innerHTML =
    '<div class="r1"><div class="n">'+안전(p.이름)+' 님</div>'+
    '<div class="when">'+남은말(p.날짜)+'</div></div>'+
    '<div class="r2">'+날말(p.날짜)+'에 5년이 차요 · '+(밖?'이 보청기는 다른 곳에서':'이 보청기는 저희에게서')+'</div>'+
    '<a class="telmini" href="tel:'+안전(p.폰)+'">'+안전(p.폰)+'</a>';
  올해상자.appendChild(el);
});

var 나중상자 = document.getElementById('나중목록');
나중.forEach(function(p){
  var 밖 = (p.어디 === '다른 곳');
  var el = document.createElement('div');
  el.className = 'row';
  el.innerHTML =
    '<div class="l"><div class="nm">'+안전(p.이름)+' 님</div>'+
    '<div class="tag'+(밖?' other':'')+'">'+(밖?'이 보청기는 다른 곳에서':'이 보청기는 저희에게서')+'</div></div>'+
    '<div class="yr">'+달말(p.날짜)+'</div>';
  나중상자.appendChild(el);
});

var 펴기 = document.getElementById('펴기');
var 펴기말 = document.getElementById('펴기말');
var 펴기표 = document.getElementById('펴기표');
펴기말.textContent = 나중.length + '분 더 있어요';
if(나중.length){
  펴기.addEventListener('click', function(){
    var 열림 = !나중상자.hidden;
    나중상자.hidden = 열림;
    펴기.setAttribute('aria-expanded', String(!열림));
    펴기표.textContent = 열림 ? '펴 보기 ▾' : '접어 두기 ▴';
    펴기말.textContent = 열림 ? (나중.length+'분 더 있어요')
                             : (나중.length+'분 · '+달말(나중[0].날짜)+'부터');
  });
}else{
  펴기.hidden = true;
}
</script>
<!-- 의견칸 시작 — 붙이기.py 가 넣습니다. 손으로 고치지 마십시오 -->
<!-- ─────────────────────────────────────────────────────────────
  _의견칸.html — 시안마다 아래에 붙이는 「이 화면 어떠세요」

  ⛔ 왜 있나 — 2026-09-09 유니스 지적.
     「UAT 라든가 UI 를 만들 때는 끊임없이 피드백 프로세스를 붙이잖아.
      왜 그런 기본적인 컨셉도 반영이 안 됐지」

     화면 다섯을 만들면서 **화면 자체에 대한 의견을 받는 자리를 하나도
     안 만들었다.** 만들어서 「보세요」로 던진 것이다.

  ⚠️ 「그 밖」 칸이 반드시 있다 — 사람규칙. 내가 만든 선택지 안에만 두면
     상대가 원하는 것이 없을 때 말을 못 하고 아무거나 고른다.

  ⚠️ **거짓 성공을 안 띄운다.** 출처가 달라 `no-cors` 로는 답을 못 읽는다.
     JSONP 로 실제 답을 받고, 못 받으면 못 받았다고 적는다 —
     2026-09-03 에 「r.됨 을 안 보고 성공 화면을 띄운」 사고가 있었다.

  쓰는 법 — 붙이기.py 가 시안 HTML 끝에 넣는다. 손으로 붙이지 않는다.
           `data-화면` 에 그 화면 이름을 적는다.
───────────────────────────────────────────────────────────── -->
<div id="의견칸" data-화면="급여_재지원">

  <h3>이 화면, 어떠세요?</h3>

  <div class="샛길" id="의견샛길" hidden>

         rel="noopener">텔레그램 열기</a>

<script>
(function(){
  var 주소 = 'https://script.google.com/macros/s/AKfycbwQ_WIS4yu5G1s9ctfDozlT7FVPJEdxie6NM40ATLjknrXj5vLBl6PSys3pJeRF6FN5/exec';
  // ⚠️ 맨 끝에 「이 밖에」가 있다 — 내가 만든 선택지 안에만 두지 않는다
  var 고를것 = ['이대로 좋아요','글씨가 작아요','칸이 많아요','어디를 눌러야 할지 모르겠어요'];
  var 고른것 = [];

  var 칸 = document.getElementById('의견고름');
  고를것.forEach(function(말, i){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = 말;
    b.onclick = function(){
      var k = 고른것.indexOf(말);
      if (k < 0) { 고른것.push(말); b.classList.add('on'); }
      else { 고른것.splice(k,1); b.classList.remove('on'); }
    };
    칸.appendChild(b);
  });

  window.의견베끼기 = function(){
    var t = document.getElementById('의견베낄것');
    t.select(); t.setSelectionRange(0, 99999);
    var 됨 = false;
    try { 됨 = document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard) {
      navigator.clipboard.writeText(t.value).then(function(){}, function(){});
      됨 = true;
    }
    var 끝 = document.getElementById('의견끝말');
    끝.hidden = false; 끝.className = '끝말';
    끝.textContent = 됨 ? '복사했습니다. 텔레그램에 붙여 넣어 주세요.'
                        : '글을 길게 눌러 복사해 주세요.';
  };

  window.의견보내기 = function(){
    var 글 = document.getElementById('의견글').value.trim();
    var b = document.getElementById('의견보냄');
    var 끝 = document.getElementById('의견끝말');
    if (!고른것.length && !글) {
      끝.hidden = false; 끝.className = '끝말 안됨';
      끝.textContent = '하나 고르시거나 한 줄 적어 주세요.';
      return;
    }
    var 화면 = document.getElementById('의견칸').getAttribute('data-화면') || '';
    b.disabled = true; b.textContent = '보내는 중';
    끝.hidden = true;
    document.getElementById('의견샛길').hidden = true;

    // JSONP — 출처가 달라 fetch 로는 답을 못 읽는다.
    // ⚠️ 답을 실제로 받은 뒤에만 「보냈습니다」를 띄운다.
    // ⛔ 이름을 영문으로 둔다. 서버가 [A-Za-z0-9_] 밖을 지우므로
    //    한글로 지으면 이름이 통째로 사라져 답이 영영 안 온다 (2026-09-09).
    var 이름 = 'fb' + Date.now();
    var 잰다 = setTimeout(function(){ 끝났다(false, '답이 안 왔습니다'); }, 12000);
    window[이름] = function(r){
      clearTimeout(잰다);
      끝났다(!!(r && r.됨), (r && r.말) || '까닭을 모르겠습니다');
    };
    function 끝났다(됨, 말){
      try { delete window[이름]; } catch(e) { window[이름] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      b.disabled = false; b.textContent = '보내기';
      끝.hidden = false;
      if (됨) {
        끝.className = '끝말';
        끝.textContent = '잘 받았습니다. 고쳐서 다시 보여 드리겠습니다.';
        b.textContent = '한 번 더 적기';

        끝.className = '끝말 안됨';

          + '아래 글을 복사해서 텔레그램으로 보내 주시면 똑같이 받습니다.';
        // ⚠️ 「막혔습니다」로 끝내지 않는다 — 가는 길을 같이 준다.
        //    구글에 로그인이 안 된 브라우저에서는 위 길이 막힌다.
        var 샛 = document.getElementById('의견샛길');
        document.getElementById('의견베낄것').value =
          '[' + (화면 || '시안') + '] '
          + (고른것.join(' · ') || '')
          + (글 ? (고른것.length ? ' / ' : '') + 글 : '');
        샛.hidden = false;
      }
    }
    var q = '?p=feedback&cb=' + 이름   // ⛔ 주소에 한글을 안 쓴다 (2026-09-06 사고)
      + '&s=' + encodeURIComponent(화면)
      + '&w=' + encodeURIComponent(고른것.join(' · '))
      + '&m=' + encodeURIComponent(글);
    var s = document.createElement('script');
    s.src = 주소 + q;
    s.onerror = function(){ 끝났다(false, '연결이 안 됐습니다'); };
    document.body.appendChild(s);
  };
})();
</script>
