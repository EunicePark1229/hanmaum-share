<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일일장부 — 한마음보청기</title>
<!--
  일일장부 — 원장님이 폰에서 그날 것을 바로 적으시는 화면

  이 화면이 하는 일 하나
    금전출납부 한 줄을 손이 제일 적게 가게 적는다.

  칸과 순서는 지금 쓰시는 엑셀 그대로다
    월 · 일 · 과목 · 매입(구입)처 · 결제내역 · 금액 · 결제수단 · 비고
    (01_한마음 판매현황_2026.xlsx 의 금전출납부 시트 3행)

  미리 채워 둔 값은 지어낸 것이 아니다
    과목 10 · 결제수단 4 · 자주 쓰는 거래처 13 은 04_산출/장부_칸값.json 을
    그대로 옮겼다. 빈도순이라 자주 쓰시는 것이 위에 온다.
    과목별 거래처·결제수단·비고는 같은 시트 134줄을 세어 넣은 것이다 —
    13_운송비는 27줄이 전부 「우체국택배 · 카드 · 하나_경애」였다.
    그래서 과목 하나를 누르면 나머지가 따라 채워진다. 손이 네 번 준다.

  지킨 것
    · 굵기로 위계를 안 만든다 — 서체(학교안심 운동장 L)에 굵기가 한 종뿐이다.
      크기 · 색 · 자리 · 여백만 쓴다.
    · 누르는 것 52px 이상 · 본문 17px · 폭 390px 에서 가로 스크롤 0.
    · 필수 칸이 없다. 하나만 적어도 저장된다.
    · 색 하나에 뜻을 안 싣는다 — 들어온 돈·나간 돈은 색과 함께 글자로도 적는다.
    · 저장은 이 폰 안(localStorage)뿐이다. 밖으로 내보내는 자리가 없다.
    · 손익·세무 판정, 청력 수치는 한 글자도 없다.

  이걸 만들면서 그만둔 것 — 그날 것을 저녁에 몰아서 엑셀에 옮겨 적는 것.
-->
<style>
:root{
  --bg:#FDF6EE;
  --card:#FFFFFF;
  --ink:#2A2118;
  --sub:#5F5044;
  --line:#EBDFD2;
  --main:#8B5E3C;
  --deep:#6E4527;
  --soft:#F6EADD;
  --in:#2F5D46;        /* 들어온 돈 — 글자로도 적는다 */
  --off:#8A7B6D;
  --bar:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'운동장','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-weight:400;                 /* 굵기는 쓰지 않는다 */
  font-size:17px;line-height:1.7;
  word-break:keep-all;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--bar) + 26px);
}
h1,h2,h3,b,strong{font-weight:inherit;margin:0;font-size:inherit;line-height:inherit}
button,input{font-family:inherit;font-weight:inherit;color:inherit;font-size:inherit}
input{-webkit-appearance:none;appearance:none;border-radius:0}

.wrap{max-width:430px;margin:0 auto;padding:12px 14px 0}

/* ── 한 칸 ───────────────────────────────────────── */
.칸{margin-bottom:18px}
.칸 .이름{font-size:15px;color:var(--sub);margin:0 3px 7px;display:flex;
     align-items:baseline;gap:7px}
.칸 .이름 .곁{font-size:14px;color:var(--off)}
.글칸{width:100%;height:56px;border:2px solid var(--line);border-radius:14px;
     padding:0 13px;font-size:17px;background:var(--card);color:var(--ink)}
.글칸::placeholder{color:#B8A794}
.글칸:focus{outline:none;border-color:var(--main)}
.글칸.찼음{border-color:#DCC9B2}

/* ── 날짜 ───────────────────────────────────────── */
.날{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.날 .상자{display:flex;align-items:center;gap:5px;border:2px solid var(--line);
     border-radius:14px;background:var(--card);height:56px;padding:0 11px 0 6px}
/* 상자 아무 데나 눌러도 커서가 들어가게 — 칸 자체가 52px 을 채운다 */
.날 .상자 input{width:44px;height:100%;border:0;background:transparent;text-align:center;
     font-size:24px;color:var(--deep);padding:0;outline:none}
.날 .상자 .u{font-size:16px;color:var(--sub)}
.날 .상자:focus-within{border-color:var(--main)}
.날 .요일{font-size:16px;color:var(--sub);flex:1 1 auto;min-width:0;padding-left:2px}
.날 .옮김{display:flex;gap:6px;flex:1 1 auto}
.날 .옮김 button{flex:1 1 0;min-width:0;height:56px;border:2px solid var(--line);
     background:var(--card);border-radius:14px;color:var(--sub);font-size:16px;
     cursor:pointer;padding:0 8px}
.날 .옮김 button.켬{border-color:var(--main);background:var(--soft);color:var(--main)}

/* ── 고르는 칩 ──────────────────────────────────── */
.둘{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.셋{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.둘 button,.셋 button{min-height:56px;padding:8px 6px;border:2px solid var(--line);
     background:var(--card);border-radius:14px;font-size:16px;line-height:1.35;
     color:var(--ink);cursor:pointer}
.둘 button.켬,.셋 button.켬{border-color:var(--main);background:var(--main);color:#FFF}
.둘 button.밖,.셋 button.밖{color:var(--sub);border-style:dashed}
.둘 button.밖.켬,.셋 button.밖.켬{color:#FFF;border-style:solid}

.칩{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.칩 button{min-height:52px;padding:0 13px;border:2px solid var(--line);
     background:var(--card);border-radius:14px;font-size:16px;color:var(--sub);
     cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;
     white-space:nowrap}
.칩 button.켬{border-color:var(--main);background:var(--soft);color:var(--main)}
.칩 .더{border-style:dashed;color:var(--off)}

/* ── 금액 ───────────────────────────────────────── */
.돈{display:flex;align-items:center;gap:9px;border:2px solid var(--line);
     border-radius:14px;background:var(--card);height:66px;padding:0 13px}
.돈:focus-within{border-color:var(--main)}
.돈 input{flex:1 1 auto;min-width:0;height:100%;border:0;background:transparent;
     text-align:right;font-size:28px;color:var(--deep);padding:0;outline:none;
     letter-spacing:.01em}
.돈 .원{font-size:17px;color:var(--sub);flex:0 0 auto}
.돈말{font-size:15px;color:var(--sub);margin:7px 3px 0;line-height:1.6}
.돈말.들어옴{color:var(--in)}

/* ── 알림 한 줄 ─────────────────────────────────── */
.말{font-size:15px;color:var(--sub);margin:9px 3px 0;line-height:1.6}
.말.짚음{color:#9C3A2E}
.말.됨{color:var(--in)}

/* ── 저장 ───────────────────────────────────────── */
.끝단추{display:flex;gap:9px;margin:22px 0 8px}
.끝단추 button{flex:1 1 0;min-height:60px;border-radius:15px;font-size:18px;cursor:pointer}
.끝단추 .넣기{border:2px solid var(--main);background:var(--main);color:#FFF}
.끝단추 .그만{flex:0 0 104px;border:2px solid var(--line);background:var(--card);color:var(--sub)}

/* ── 나눔선 ─────────────────────────────────────── */
.나눔{display:flex;align-items:center;gap:10px;margin:26px 2px 14px;
     color:var(--sub);font-size:15px;white-space:nowrap}
.나눔::before,.나눔::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── 목록 ───────────────────────────────────────── */
.보기고름{display:flex;gap:7px;margin-bottom:12px}
.보기고름 button{flex:1 1 0;min-height:52px;border:2px solid var(--line);
     background:var(--card);border-radius:14px;font-size:16px;color:var(--sub);cursor:pointer}
.보기고름 button.켬{border-color:var(--main);background:var(--soft);color:var(--main)}

.합{background:var(--card);border:2px solid var(--line);border-radius:16px;
     padding:11px 14px;margin-bottom:12px}
.합 .줄{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
     padding:6px 0}
.합 .줄+.줄{border-top:1px solid var(--line)}
.합 .l{font-size:16px;color:var(--sub)}
.합 .v{font-size:22px;color:var(--deep);white-space:nowrap}
.합 .v small{font-size:15px;color:var(--sub);margin-left:2px}
.합 .줄.들어옴 .v{color:var(--in)}

.줄칸{background:var(--card);border:2px solid var(--line);border-radius:16px;
     margin-bottom:9px;overflow:hidden}
.줄칸.펼침{border-color:var(--main)}
.줄머리{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:56px;
     padding:12px 13px;border:0;background:transparent;text-align:left;cursor:pointer}
.줄머리 .왼{flex:1 1 auto;min-width:0}
.줄머리 .첫{display:block;font-size:17px;line-height:1.4;overflow:hidden;
     text-overflow:ellipsis;white-space:nowrap}
.줄머리 .둘째{display:block;font-size:15px;color:var(--sub);line-height:1.5;
     margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.줄머리 .오{flex:0 0 auto;text-align:right}
.줄머리 .돈값{display:block;font-size:19px;color:var(--deep);white-space:nowrap}
.줄머리 .돈값.들어옴{color:var(--in)}
.줄머리 .꼬리{display:block;font-size:14px;color:var(--sub);white-space:nowrap}
.줄속{padding:0 13px 13px;border-top:1px solid var(--line)}
.줄속 .자세{font-size:15px;color:var(--sub);line-height:1.65;padding:11px 1px 0}
.줄단추{display:flex;gap:8px;margin-top:11px}
.줄단추 button{flex:1 1 0;min-height:56px;border-radius:14px;font-size:16px;cursor:pointer;
     border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 6px}
.줄단추 .고침{border-color:var(--main);color:var(--main);background:var(--soft)}
.줄단추 .지움{color:#9C3A2E}
.줄단추 .진짜{background:#9C3A2E;border-color:#9C3A2E;color:#FFF}

.빈{border:2px dashed var(--line);border-radius:16px;padding:26px 16px;
     text-align:center;color:var(--sub);font-size:16px;line-height:1.7}

.꼬리말{margin:22px 3px 0;font-size:15px;color:var(--sub);line-height:1.7}
.베끼기{width:100%;min-height:56px;margin-top:12px;border:2px solid var(--line);
     background:var(--card);border-radius:14px;color:var(--sub);font-size:16px;
     cursor:pointer;padding:0 10px}

/* ── 아래 띠 — 그날 합계가 늘 보이게 ─────────────── */
.띠{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(253,246,238,.98);
     border-top:2px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.띠 .속{max-width:430px;margin:0 auto;display:flex;align-items:center;gap:10px}
.띠 .날짜{font-size:15px;color:var(--sub);flex:0 0 auto}
.띠 .수{flex:1 1 auto;min-width:0;text-align:right;font-size:16px;line-height:1.35;
     color:var(--deep);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.띠 .수 .들{color:var(--in)}
.띠 .수 .곁{font-size:14px;color:var(--sub)}
</style>
</head>
<body>

<div class="wrap">

  <!-- ① 월 · 일 — 오늘로 미리 채워 둔다 -->
  <div class="칸">
    <div class="날">
      <div class="상자">
        <input id="월" inputmode="numeric" maxlength="2" aria-label="월"><span class="u">월</span>
      </div>
      <div class="상자">
        <input id="일" inputmode="numeric" maxlength="2" aria-label="일"><span class="u">일</span>
      </div>
      <span class="요일" id="요일"></span>
    </div>
    <div class="날" style="margin-top:8px">
      <div class="옮김">
        <button type="button" id="어제" onclick="날옮기기(-1)">하루 앞</button>
        <button type="button" id="오늘로" onclick="오늘로()">오늘</button>
        <button type="button" id="내일" onclick="날옮기기(1)">하루 뒤</button>
      </div>
    </div>
  </div>

  <!-- ② 과목 -->
  <div class="칸">
    <div class="이름">과목</div>
    <div class="둘" id="과목칸"></div>
    <input class="글칸" id="과목직접" hidden placeholder="과목을 그대로 적어 주세요"
           style="margin-top:8px">
    <p class="말" id="따라채움" hidden></p>
  </div>

  <!-- ③ 매입(구입)처 -->
  <div class="칸">
    <div class="이름">매입(구입)처</div>
    <input class="글칸" id="처" placeholder="눌러서 고르시거나 적어 주세요">
    <div class="칩" id="처칩"></div>
  </div>

  <!-- ④ 결제내역 -->
  <div class="칸">
    <div class="이름">결제내역</div>
    <input class="글칸" id="내역" placeholder="예 — 조순례님 신규보청기 발송">
  </div>

  <!-- ⑤ 금액 -->
  <div class="칸">
    <div class="이름">금액</div>
    <div class="돈">
      <input id="금액" inputmode="numeric" placeholder="0" aria-label="금액">
      <span class="원">원</span>
    </div>
    <p class="돈말" id="돈말">과목을 고르시면 들어온 돈인지 나간 돈인지 여기에 적힙니다.</p>
  </div>

  <!-- ⑥ 결제수단 -->
  <div class="칸">
    <div class="이름">결제수단</div>
    <div class="셋" id="수단칸"></div>
    <input class="글칸" id="수단직접" hidden placeholder="결제수단을 그대로 적어 주세요"
           style="margin-top:8px">
  </div>

  <!-- ⑦ 비고 -->
  <div class="칸">
    <div class="이름">비고 <span class="곁">안 적으셔도 됩니다</span></div>
    <input class="글칸" id="비고" placeholder="어느 카드·통장인지">
    <div class="칩" id="비고칩"></div>
  </div>

  <div class="끝단추">
    <button type="button" class="넣기" id="저장" onclick="넣기()">한 줄 넣기</button>
    <button type="button" class="그만" id="그만" hidden onclick="고치기그만()">그만</button>
  </div>
  <p class="말" id="알림" hidden></p>

  <!-- ── 적은 것 ────────────────────────────────── -->
  <div class="나눔" id="목록머리">적은 것</div>

  <div class="보기고름">
    <button type="button" id="보기날" class="켬" onclick="보기('날')">이 날</button>
    <button type="button" id="보기달" onclick="보기('달')">이 달 전체</button>
  </div>

  <div class="합" id="합계"></div>
  <div id="목록"></div>

  <button type="button" class="베끼기" onclick="베끼기()">
    보이는 것 베끼기 — 엑셀에 붙여 넣게</button>

  <p class="꼬리말">
    여기 적은 것은 이 폰 안에만 남습니다. 밖으로 나가지 않습니다.<br>
    폰을 바꾸시거나 브라우저 기록을 지우시면 함께 지워지니, 엑셀에는 따로 옮겨 두시면 좋습니다.
  </p>
</div>

<div class="띠" id="띠" hidden>
  <div class="속">
    <span class="날짜" id="띠날짜"></span>
    <span class="수" id="띠수"></span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ── 값 — 04_산출/장부_칸값.json 을 그대로 옮긴 것 (빈도순) ────── */
  var 과목목록 = ["매출","13_운송비","08_광고선전비","80_기타판관비","매입",
                "07_수도광열비","06_여비교통비","10_접대비","05_세금과공과","02_식비회식비"];
  var 수단목록 = ["카드","계좌이체","입금","현금"];
  var 자주쓰는처 = ["우체국택배","비즈하우스","나스콤","한국전력공사","다이소몰","미리캔버스",
                 "국민건강보험공단","구글_제미나이","조순례","옥션","복음보청기",
                 "더블유에스올로지","방문구매"];
  var 비고목록 = ["하나_경애","사업자통장","NH체크카드","신한카드","삼성카드","비씨카드","현금"];

  /* 과목별로 늘 쓰시던 것 — 금전출납부 134줄을 세어 넣었다.
     처가 하나뿐이거나 결제수단·비고가 여덟 할을 넘으면 눌렀을 때 따라 채운다. */
  var 과목별 = {
    "매출":         {처:["국민건강보험공단","조순례","방문구매","김선희"]},
    "13_운송비":    {처:["우체국택배"], 수단:"카드", 비고:"하나_경애"},
    "08_광고선전비":{처:["비즈하우스","미리캔버스","구글_제미나이","네이버페이"],
                    수단:"카드", 비고:"하나_경애"},
    "80_기타판관비":{처:["나스콤","다이소몰","옥션","CJ온스타일","지마켓"],
                    수단:"카드", 비고:"하나_경애"},
    "매입":         {처:["복음보청기","더블유에스올로지","지엔히어링코리아","소노바코리아유한회사"],
                    수단:"계좌이체", 비고:"사업자통장"},
    "07_수도광열비":{처:["한국전력공사"], 수단:"카드", 비고:"하나_경애"},
    "06_여비교통비":{처:["그린주유소","주유비","휴게소"], 수단:"카드", 비고:"하나_경애"},

      } else {
        끝.className = '끝말 안됨';
        끝.textContent = '이 화면에서는 바로 못 보냈습니다 (' + 말 + '). '
          + '아래 글을 복사해서 텔레그램으로 보내 주시면 똑같이 받습니다.';
        // ⚠️ 「막혔습니다」로 끝내지 않는다 — 가는 길을 같이 준다.
        //    구글에 로그인이 안 된 브라우저에서는 위 길이 막힌다.
        var 샛 = document.getElementById('의견샛길');
        document.getElementById('의견베낄것').value =
          '[' + (화면 || '시안') + '] '
          + (고른것.join(' · ') || '')
          + (글 ? (고른것.length ? ' / ' : '') + 글 : '');
        샛.hidden = false;
      }
    }
    var q = '?p=feedback&cb=' + 이름   // ⛔ 주소에 한글을 안 쓴다 (2026-09-06 사고)
      + '&s=' + encodeURIComponent(화면)
      + '&w=' + encodeURIComponent(고른것.join(' · '))
      + '&m=' + encodeURIComponent(글);
    var s = document.createElement('script');
    s.src = 주소 + q;
    s.onerror = function(){ 끝났다(false, '연결이 안 됐습니다'); };
    document.body.appendChild(s);
  };
})();
</script>
<!-- 의견칸 끝 -->
</body>
</html>
